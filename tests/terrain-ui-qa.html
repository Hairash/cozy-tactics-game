<!doctype html><meta charset="utf-8"><title>Terrain UI regression fixtures</title><style>body{margin:0;background:#102b30;color:#e8dfc2;font:14px system-ui}nav{padding:10px;display:flex;gap:8px}button{padding:8px}#stage{position:relative;width:1024px;height:576px;margin:auto}iframe{border:0;width:1280px;height:720px;display:block;transform:scale(.8);transform-origin:top left}output{display:block;padding:10px;white-space:pre-wrap}</style><nav><button data-case="bends">Bends and bridges</button><button data-case="objects">Crate river and gate</button><button data-case="effects">Effects on both teams</button><button data-case="conductor">Conductor</button><button data-case="tidecaller">Tidecaller choices</button><button data-case="targets">Ability targets</button><button data-case="path">Path and fragment</button><button data-case="weather">Weather help</button><button data-case="drone">Beekeeper drone</button><button id="phone">Phone</button><button id="desktop">Desktop</button><button id="measure">Measure</button><select id="step" aria-label="UI step"><option value="ability">Use game ability</option><option value="crate">Push crate</option><option value="entry">Entry north</option><option value="exit">Exit west</option><option value="tile">Target B6</option><option value="inspect">Inspect crew</option></select><button id="runstep">Run UI step</button></nav><div id="stage"><iframe title="Game fixture" src="ui-fixture-game.html"></iframe></div><output>Ready</output><script>const frame=document.querySelector('iframe');frame.onload=()=>frame.contentWindow.setupScenario('bends');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>frame.contentWindow.setupScenario(b.dataset.case));document.querySelector('#phone').onclick=()=>{frame.style.width='390px';frame.style.height='844px';frame.style.transform='scale(.7)';document.querySelector('#stage').style.width='273px';document.querySelector('#stage').style.height='591px';frame.contentWindow.fitBoard()};document.querySelector('#desktop').onclick=()=>{frame.style.width='1280px';frame.style.height='720px';frame.style.transform='scale(.8)';document.querySelector('#stage').style.width='1024px';document.querySelector('#stage').style.height='576px';frame.contentWindow.fitBoard()};document.querySelector('#measure').onclick=async()=>{document.querySelector('output').textContent='Measuring…';for(let i=0;i<600&&frame.contentWindow.fixtureReport().busy;i++)await new Promise(r=>requestAnimationFrame(r));document.querySelector('output').textContent=JSON.stringify(frame.contentWindow.fixtureReport());};document.querySelector('#runstep').onclick=()=>{const d=frame.contentDocument,k=document.querySelector('#step').value;if(k==='crate')d.querySelector('.cell[data-x="1"][data-y="3"]').click();if(k==='ability')d.querySelector('#ability').click();if(k==='entry')d.querySelector('[data-river-entry="0"]').click();if(k==='exit')d.querySelector('[data-direction="3"]').click();if(k==='tile')d.querySelector('.cell[data-x="1"][data-y="5"]').click();if(k==='inspect')d.querySelector('.cell:has([data-piece="a0"])').dispatchEvent(new frame.contentWindow.MouseEvent('contextmenu',{bubbles:true,cancelable:true}));};</script>
