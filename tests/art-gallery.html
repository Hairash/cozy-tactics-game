<!doctype html><html lang="en"><meta charset="utf-8"><title>Raster art proof · The Last Current</title><style>body{background:#20393a;color:#f2e7c6;font:16px system-ui;margin:24px}h2{margin-top:32px}section{display:flex;flex-wrap:wrap;gap:12px}.card{width:180px;background:#dcd6b8;color:#233b3b;border-radius:8px;padding:10px}.samples{display:flex;align-items:end;gap:12px;background:linear-gradient(90deg,#d8caaa 50%,#29494a 50%);border-radius:4px}img{object-fit:contain}label{display:block;margin-top:6px;font-size:14px}output{position:sticky;top:0;background:#162d30;padding:12px;display:block}</style><output>Checking all raster images…</output><main></main><script src="../dist/asset-catalog.js"></script><script>
const pending=[];for(const cat of ['roles','enemies','objects','terrain']){const title=document.createElement('h2');title.textContent=cat;document.querySelector('main').append(title);const section=document.createElement('section');document.querySelector('main').append(section);for(const [id,a]of Object.entries(ART_CATALOG[cat])){const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="samples"><img width="80" height="80" src="../dist/${a.src}" alt="${id}"><img width="40" height="40" src="../dist/${a.src}" alt=""></div><label>${id}</label>`;section.append(card);const im=card.querySelector('img');pending.push(new Promise(resolve=>{im.onload=()=>resolve({id:cat+'/'+id,ok:im.naturalWidth===80&&im.naturalHeight===80});im.onerror=()=>resolve({id:cat+'/'+id,ok:false})}))}}
Promise.all(pending).then(rows=>document.querySelector('output').textContent=JSON.stringify({total:rows.length,passed:rows.filter(r=>r.ok).length,failed:rows.filter(r=>!r.ok).map(r=>r.id)}));
</script></html>
