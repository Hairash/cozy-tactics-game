<!doctype html><html><head><meta charset="utf-8"><title>Visual QA · The Last Current</title><style>body{margin:0;background:#081d25;color:#d4dfcc;font:12px system-ui}nav{display:flex;gap:9px;padding:12px;align-items:center}button,select{background:#28494b;color:#eadbb5;border:1px solid #6e8973;border-radius:5px;padding:7px}#stage{margin:12px auto;position:relative}iframe{border:0;transform-origin:top left;display:block}output{display:block;padding:12px;white-space:pre-wrap;max-height:80px;overflow:auto}</style></head><body><nav><strong>Visual QA</strong><button data-size="1920,1080,.5">Large 1920 × 1080</button><button data-size="1280,720,.8">Laptop 1280 × 720</button><button data-size="1024,600,.9">Compact 1024 × 600</button><button data-size="390,844,.75">Phone 390 × 844</button><select id="mission" aria-label="Test mission"><option value="0">1 · Opening</option><option value="96">97 · Late boss</option><option value="99">100 · Finale</option></select><button id="renderall">Render all 100</button><button id="inspect">Measure layout</button></nav><div id="stage"><iframe title="Game under test" src="../dist/"></iframe></div><output id="result">Ready</output><script>
const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),out=document.querySelector('output');let w=1280,h=720;
function size(a){[w,h,scale]=a.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';if(frame.contentWindow.fitBoard)frame.contentWindow.fitBoard()}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>size(b.dataset.size));size('1280,720,.8');
frame.onload=()=>{frame.contentWindow.load(0,false)};
document.querySelector('#mission').onchange=e=>frame.contentWindow.load(+e.target.value,false);
function measure(){const d=frame.contentDocument,b=d.querySelector('.board').getBoundingClientRect(),end=d.querySelector('#end').getBoundingClientRect();const area=d.querySelector('.board-area').getBoundingClientRect(),cells=[...d.querySelectorAll('.cell')];return {maxCell:Math.max(...cells.map(c=>Math.max(c.getBoundingClientRect().width,c.getBoundingClientRect().height))),centerError:Math.abs((b.left+b.right-area.left-area.right)/2),riversClipped:[...d.querySelectorAll('.river-art')].every(r=>getComputedStyle(r).overflow==='hidden'&&r.querySelector('clipPath rect')),moveHighlights:d.querySelectorAll('.move-highlight').length,targetHighlights:d.querySelectorAll('.target-highlight').length,viewport:[w,h],document:[d.documentElement.clientWidth,d.documentElement.scrollWidth],board:[Math.round(b.width),Math.round(b.height)],endBottom:Math.round(end.bottom),boardHeightShare:Math.round(b.height/h*100),boardWidthShare:Math.round(b.width/d.documentElement.clientWidth*100),rasterImages:d.querySelectorAll('.board .raster-unit,.board .raster-object,.board .raster-ground').length,brokenImages:[...d.querySelectorAll('img')].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.getAttribute('src')),legacyArt:d.querySelectorAll('.board svg.piece,.board svg.scenery,.board svg.ground-art').length,objectiveVisible:d.querySelector('.objective-card').getBoundingClientRect().height>0,objectiveFont:d.defaultView.getComputedStyle(d.querySelector('.objective')).fontSize,fieldTextNodes:d.querySelector('.board-wrap').querySelectorAll('.board-top,.board-bottom,.field-peek,.route-caption').length,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth+1,clippedDesktop:w>700&&end.bottom>h+1}}
document.querySelector('#inspect').onclick=()=>out.textContent=JSON.stringify(measure());
document.querySelector('#renderall').onclick=async()=>{const failures=[];for(let i=0;i<100;i++){try{frame.contentWindow.load(i,false);await Promise.all([...frame.contentDocument.images].map(i=>i.decode().catch(()=>{})));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const m=measure();if(m.maxCell>80.1||m.centerError>3||!m.riversClipped||m.brokenImages.length||m.legacyArt||!m.rasterImages||!m.objectiveVisible||m.horizontalOverflow||m.clippedDesktop||m.fieldTextNodes||parseFloat(m.objectiveFont)<16)failures.push({mission:i+1,...m})}catch(e){failures.push({mission:i+1,error:e.message})}out.textContent='Rendered '+(i+1)+'/100; failures '+failures.length;}out.textContent=JSON.stringify({rendered:100,viewport:[w,h],failures});};
</script></body></html>
